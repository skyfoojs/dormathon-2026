<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AiGIS Settings</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.eyebrow{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#4A6078;font-weight:500}
.tag{display:inline-block;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:3px;font-weight:500;white-space:nowrap}
.t-syn{border:1px dashed #4A6078;color:#2B4560}
.t-db{background:#0C4B87;color:#FFFFFF;border:1px solid #0C4B87}
.t-pub{background:#E1F0FA;color:#0C4B87;border:1px solid #9CCBEA}
.t-asm{background:#FDEBC2;color:#5C3A00;border:1px solid #E0A92E}
.t-man{background:#E9E5F7;color:#3F2F7A;border:1px solid #BDB1DE}
.t-calc{background:#E6ECF2;color:#1D3A57;border:1px solid #C3D0DD}
.t-hi{background:#D9293B;color:#FFFFFF;border:1px solid #D9293B}
.t-ok{background:#FFFFFF;color:#2B4560;border:1px solid #C3D0DD}
.card{background:#FFFFFF;border:1px solid #D6DFE8;border-radius:10px}
.nav{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:8px;color:#0A2540;text-decoration:none;font-weight:600;font-size:15px}
.nav{position:relative;white-space:nowrap}
.navtog{flex:none;width:44px;height:44px;border-radius:8px;border:1.5px solid #D6DFE8;background:#FFFFFF;color:#0C4B87;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.navtog:hover{background:#EAF3FA}
.nav:hover{background:#EAF3FA}
.nav-on,.nav-on:hover{background:#0C4B87;color:#FFFFFF}
.badge{margin-left:auto;min-width:22px;height:22px;padding:0 6px;box-sizing:border-box;border-radius:11px;background:#D9293B;color:#FFFFFF;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.num{font-family:'IBM Plex Mono',ui-monospace,monospace;white-space:nowrap}
.inp{box-sizing:border-box;min-height:44px;padding:0 12px;border:1.5px solid #6B8199;border-radius:6px;background:#FFFFFF;color:#0A2540;font-family:inherit;font-size:15px;width:100%}
.btn{min-height:44px;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:14px;font-weight:600;border:2px solid #0C4B87;background:transparent;color:#0C4B87;font-family:inherit;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn-p{background:#0C4B87;color:#FFFFFF}
.sw{display:flex;align-items:center;gap:12px;min-height:44px;width:100%;box-sizing:border-box;padding:6px 0;background:transparent;border:0;font-family:inherit;font-size:15px;color:#0A2540;text-align:left;cursor:pointer}
.sw-t{flex:none;width:44px;height:26px;border-radius:13px;background:#6B8199;position:relative}
.sw-t::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#FFFFFF}
.sw-on .sw-t{background:#0C4B87}
.sw-on .sw-t::after{left:21px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:#4A6078;font-weight:500;text-align:left;padding:10px 12px;border-bottom:1.5px solid #6B8199;white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid #D6DFE8;vertical-align:middle}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #3DA5E0;outline-offset:2px}
</style>

</head>
<body>
<div id="app"></div>
<template id="tpl">


<div style="position:relative;display:flex;align-items:stretch;min-height:100vh;background:#F3F6F9;color:#0A2540;font-family:'Archivo',system-ui,sans-serif;font-size:15px;line-height:1.5">

<aside style="position:absolute;left:0;top:0;bottom:0;z-index:100;width:{{navW}}px;box-sizing:border-box;background:#FFFFFF;border-right:1px solid #D6DFE8;padding:12px 8px;display:flex;flex-direction:column;gap:20px;box-shadow:{{navShadow}};overflow:hidden">
<div style="display:flex;flex-direction:{{navHdrDir}};align-items:center;justify-content:{{navJ}};gap:12px">
<template data-sc="if" value="{{navClosed}}" hint-placeholder-val="{{ false }}"><div role="img" aria-label="AiGIS" style="flex:none;position:relative;width:37px;height:48px;overflow:hidden"><img data-logo="1" alt="" style="position:absolute;left:-5px;top:-4.4px;width:109px;height:auto;max-width:none"></div></template>
<template data-sc="if" value="{{navOpen}}" hint-placeholder-val="{{ true }}"><img data-logo="1" alt="AiGIS, AI Guardian Intelligence System" style="width:164px;height:auto;display:block"></template>
<button class="navtog" aria-label="{{navTogLabel}}" aria-expanded="{{navExp}}" onClick="{{toggleNav}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
</div>
<nav aria-label="Main" style="display:flex;flex-direction:column;gap:4px">
<a class="nav" href="dashboard.html" aria-label="Dashboard" style="justify-content:{{navJ}};padding:{{navPad}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect></svg><span style="display:{{lblDisp}}">Dashboard</span></a>
<a class="nav" href="inventory.html" aria-label="Inventory" style="justify-content:{{navJ}};padding:{{navPad}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"></path><path d="M3 7l9 4 9-4M12 11v10"></path></svg><span style="display:{{lblDisp}}">Inventory</span></a>
<a class="nav" href="predictions.html" aria-label="Predictions" style="justify-content:{{navJ}};padding:{{navPad}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"></path><path d="M16 7h5v5"></path></svg><span style="display:{{lblDisp}}">Predictions</span></a>
<a class="nav" href="warnings.html" aria-label="Warnings" style="justify-content:{{navJ}};padding:{{navPad}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l10 18H2z"></path><path d="M12 10v4M12 17.5v.5"></path></svg><span style="display:{{lblDisp}}">Warnings</span><span class="badge" style="{{badgeStyle}}" aria-label="6 to resolve">6</span></a>
<a class="nav" href="insights.html" aria-label="Insights" style="justify-content:{{navJ}};padding:{{navPad}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="6" cy="7" r="2.5"></circle><circle cx="18" cy="7" r="2.5"></circle><circle cx="12" cy="17" r="2.5"></circle><path d="M8.3 8.2l2.5 6.5M15.7 8.2l-2.5 6.5M8.5 7h7"></path></svg><span style="display:{{lblDisp}}">Insights</span></a>
<a class="nav nav-on" href="settings.html" aria-current="page" aria-label="Settings" style="justify-content:{{navJ}};padding:{{navPad}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 17h16"></path><circle cx="9" cy="7" r="2.5" fill="currentColor"></circle><circle cx="15" cy="17" r="2.5" fill="currentColor"></circle></svg><span style="display:{{lblDisp}}">Settings</span></a>
</nav>
<template data-sc="if" value="{{navOpen}}" hint-placeholder-val="{{ true }}">
<div style="margin-top:auto;display:flex;flex-direction:column;gap:6px;font-size:13px;color:#4A6078;padding:0 8px">
<span class="tag t-syn" style="align-self:flex-start">Mockup · sample data</span>
<a href="predictions.html" style="color:#0C4B87;font-weight:600">Last sync 34 min ago</a>
</div>
</template>
</aside>

<div style="flex:1 1 560px;min-width:0;margin-left:64px;display:flex;flex-direction:column">

<header style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px 24px;padding:12px 32px;background:#FFFFFF;border-bottom:1px solid #D6DFE8">
<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
<span class="eyebrow">Facility</span>
<span style="font-weight:600">Hospital Kuala Lumpur</span>
<span style="font-size:13.5px;color:#4A6078">Public · Large · Kuala Lumpur, W.P. Kuala Lumpur</span>
</div>
<a href="warnings.html" aria-label="6 warnings to resolve" style="position:relative;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:8px;border:1.5px solid #D6DFE8;color:#0C4B87"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 0112 0c0 6 2 7 2 7H4s2-1 2-7"></path><path d="M10 20a2 2 0 004 0"></path></svg><span class="badge" style="position:absolute;top:-8px;right:-8px;margin:0">6</span></a>
</header>

<main style="padding:28px 32px 48px;display:flex;flex-direction:column;gap:20px;max-width:1240px;box-sizing:border-box;width:100%">

<div>
<h1 style="margin:0;font-size:32px;line-height:1.15;font-weight:700;letter-spacing:-.01em">Settings</h1>
<p style="margin:4px 0 0;font-size:15.5px;color:#4A6078">Link your database, map its tables, and choose how often AiGIS reads outside sources.</p>
</div>

<section class="card" style="padding:22px 24px;display:flex;flex-direction:column;gap:16px">
<div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px">
<h2 style="margin:0;font-size:19px;font-weight:600">1. Database connection</h2>
<div style="display:flex;gap:8px;flex-wrap:wrap"><span class="tag t-syn">Design only, nothing connects</span><span class="tag {{connCls}}">{{connText}}</span></div>
</div>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:14px 16px">
<div style="display:flex;flex-direction:column;gap:4px"><label for="dbt" style="font-size:13.5px;font-weight:600">Database type</label>
<select id="dbt" class="inp" value="{{dbType}}" onChange="{{onType}}"><template data-sc="for" list="{{typeOptions}}" as="o" hint-placeholder-count="5"><option value="{{o}}">{{o}}</option></template></select></div>
<div style="display:flex;flex-direction:column;gap:4px"><label for="host" style="font-size:13.5px;font-weight:600">Host</label><input id="host" class="inp" type="text" value="{{host}}" placeholder="[HOST]" onInput="{{onHost}}"></div>
<div style="display:flex;flex-direction:column;gap:4px"><label for="port" style="font-size:13.5px;font-weight:600">Port</label><input id="port" class="inp" type="text" value="{{port}}" onInput="{{onPort}}"></div>
<div style="display:flex;flex-direction:column;gap:4px"><label for="dbn" style="font-size:13.5px;font-weight:600">Database name</label><input id="dbn" class="inp" type="text" value="{{dbName}}" placeholder="[DATABASE]" onInput="{{onDbName}}"></div>
<div style="display:flex;flex-direction:column;gap:4px"><label for="usr" style="font-size:13.5px;font-weight:600">Read-only user</label><input id="usr" class="inp" type="text" value="{{user}}" placeholder="[USER]" onInput="{{onUser}}"></div>
<div style="display:flex;flex-direction:column;gap:4px"><label for="pwd" style="font-size:13.5px;font-weight:600">Password</label><input id="pwd" class="inp" type="password" value="{{pass}}" placeholder="Not stored in this design" onInput="{{onPass}}"></div>
</div>
<div style="display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center">
<button class="btn btn-p" onClick="{{testConn}}">Test connection</button>
<span role="status" style="font-size:14px;color:#2B4560">{{connNote}}</span>
</div>
</section>

<section class="card" style="padding:22px 8px 14px;display:flex;flex-direction:column;gap:14px;min-width:0">
<div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px;padding:0 16px">
<div><h2 style="margin:0;font-size:19px;font-weight:600">2. Map tables</h2><div style="font-size:13.5px;color:#2B4560">AiGIS read these seven tables from your schema. Change the source if your names differ.</div></div>
<span class="tag t-syn">Mockup</span>
</div>
<div style="overflow-x:auto">
<table style="min-width:760px">
<thead><tr><th>AiGIS table</th><th>Source table</th><th>Rows</th><th>Used for</th><th>Mapping</th></tr></thead>
<tbody>
<template data-sc="for" list="{{tables}}" as="t" hint-placeholder-count="7">
<tr>
<td class="num" style="font-weight:500">{{t.name}}</td>
<td><select class="inp" style="min-width:200px" aria-label="Source table for {{t.name}}" value="{{t.src}}" onChange="{{t.on}}"><template data-sc="for" list="{{t.options}}" as="o" hint-placeholder-count="3"><option value="{{o}}">{{o}}</option></template></select></td>
<td class="num">{{t.rows}}</td>
<td style="font-size:13.5px;color:#2B4560">{{t.use}}</td>
<td><span class="tag {{t.cls}}">{{t.status}}</span></td>
</tr>
</template>
</tbody>
</table>
</div>
</section>

<section class="card" style="padding:22px 24px;display:flex;flex-direction:column;gap:16px">
<div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px">
<h2 style="margin:0;font-size:19px;font-weight:600">3. Migration</h2><span class="tag t-syn">Mockup</span>
</div>
<div style="display:flex;flex-wrap:wrap;gap:20px">
<div style="flex:1 1 340px;min-width:0;display:flex;flex-direction:column;gap:12px">
<div style="font-size:14.5px;color:#2B4560">A dry run reads your tables, checks types and keys, and reports problems. It writes nothing.</div>
<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-p" onClick="{{runDry}}">Run dry run</button><button class="btn" onClick="{{resetDry}}">Reset</button></div>
<ol style="margin:0;padding:0;list-style:none;display:flex;flex-direction:column">
<template data-sc="for" list="{{steps}}" as="s" hint-placeholder-count="5">
<li style="display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid #D6DFE8"><span class="tag {{s.cls}}" style="flex:none;width:72px;text-align:center;box-sizing:border-box">{{s.state}}</span><div><div style="font-weight:600">{{s.title}}</div><div style="font-size:13.5px;color:#2B4560">{{s.note}}</div></div></li>
</template>
</ol>
</div>
<div style="flex:1 1 340px;min-width:0;display:flex;flex-direction:column;gap:8px">
<h3 style="margin:0;font-size:15px;font-weight:600">Migration history</h3>
<div style="display:flex;flex-direction:column">
<template data-sc="for" list="{{history}}" as="h" hint-placeholder-count="3">
<div style="display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:space-between;padding:10px 0;border-top:1px solid #D6DFE8"><div><div style="font-weight:600">{{h.title}}</div><div style="font-size:13.5px;color:#2B4560">{{h.note}}</div></div><span class="tag t-ok">{{h.when}}</span></div>
</template>
</div>
</div>
</div>
</section>

<section class="card" style="padding:22px 24px;display:flex;flex-direction:column;gap:12px">
<div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px">
<h2 style="margin:0;font-size:19px;font-weight:600">4. Sync and sources</h2><span class="tag t-syn">Mockup</span>
</div>
<div style="display:flex;flex-wrap:wrap;gap:8px 32px">
<div style="flex:1 1 320px;min-width:0">
<template data-sc="for" list="{{toggles}}" as="t" hint-placeholder-count="5">
<button class="sw {{t.cls}}" role="switch" aria-checked="{{t.checked}}" onClick="{{t.flip}}"><span class="sw-t"></span><span><span style="font-weight:600">{{t.label}}</span><br><span style="font-size:13px;color:#4A6078">{{t.sub}}</span></span></button>
</template>
</div>
<div style="flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:14px">
<div style="display:flex;flex-direction:column;gap:4px"><label for="freq" style="font-size:13.5px;font-weight:600">Scheduled sync</label>
<select id="freq" class="inp" value="{{freq}}" onChange="{{onFreq}}"><template data-sc="for" list="{{freqOptions}}" as="o" hint-placeholder-count="4"><option value="{{o}}">{{o}}</option></template></select></div>
<div style="display:flex;flex-direction:column;gap:0"><label for="sens" style="display:flex;justify-content:space-between;font-size:13.5px;font-weight:600"><span>Alert sensitivity</span><span class="num">{{sensText}}</span></label>
<input id="sens" type="range" min="1" max="5" step="1" value="{{sens}}" onInput="{{onSens}}" style="width:100%;min-height:44px;accent-color:#0C4B87">
<span style="font-size:12.5px;color:#4A6078">Higher means more warnings, including some that turn out to be nothing.</span></div>
</div>
</div>
</section>

</main>
</div>
</div>

</template>

      navExp: (this.state && this.state.nav) ? 'true' : 'false', navTogLabel: (this.state && this.state.nav) ? 'Collapse menu' : 'Expand menu',
      toggleNav: () => this.setState({ nav: !(this.state && this.state.nav) }),
      dbType: st.dbType, typeOptions: TYPES, host: st.host, port: st.port, dbName: st.dbName, user: st.user, pass: st.pass,
      onType: (e) => this.setState({ dbType: e.target.value, port: PORTS[e.target.value], conn: 'idle' }),
      onHost: (e) => this.setState({ host: e.target.value, conn: 'idle' }),
      onPort: (e) => this.setState({ port: e.target.value }),
      onDbName: (e) => this.setState({ dbName: e.target.value, conn: 'idle' }),
      onUser: (e) => this.setState({ user: e.target.value, conn: 'idle' }),
      onPass: (e) => this.setState({ pass: e.target.value }),
      testConn: () => { const c = this.cur(); this.setState({ conn: (c.host && c.dbName && c.user) ? 'ok' : 'fail' }); },
      connText, connCls, connNote,
      tables, steps,
      runDry: () => this.setState({ dry: 5 }), resetDry: () => this.setState({ dry: 0 }),
      history: [
        { title: 'Initial import, dry run', note: '7 tables read. No data written.', when: 'Today 14:05' },
        { title: 'Mapped legacy item names', note: 'items matched by name to suppliers.', when: '9 Oct' },
        { title: 'Schema created', note: 'Seven tables added to the AiGIS workspace.', when: '2 Oct' }
      ],
      toggles, freq: st.freq, freqOptions: ['Every 15 minutes', 'Every hour', 'Every 6 hours', 'Daily'],
      onFreq: (e) => this.setState({ freq: e.target.value }),
      sens: st.sens, sensText: SENS[st.sens], onSens: (e) => this.setState({ sens: Number(e.target.value) })
    };
  }
}

</script>
<script>
(function(){
  function get(path,scopes){
    var parts=path.trim().split('.');
    for(var i=scopes.length-1;i>=0;i--){ if(parts[0] in scopes[i]){ var v=scopes[i]; for(var j=0;j<parts.length;j++){ if(v==null) return undefined; v=v[parts[j]]; } return v; } }
    return undefined;
  }
  function interp(str,scopes){ return str.replace(/\{\{\s*([^}]+?)\s*\}\}/g,function(m,p){ var v=get(p,scopes); return v==null?'':String(v); }); }
  function single(str){ var m=/^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/.exec(str); return m?m[1]:null; }
  function build(nodes,parent,scopes,root){
    nodes.forEach(function(node){
      if(node.nodeType===3){ parent.appendChild(document.createTextNode(interp(node.data,scopes))); return; }
      if(node.nodeType!==1) return;
      var tag=node.localName;
      if(tag==='template' && node.getAttribute('data-sc')==='for'){
        var list=get(single(node.getAttribute('list'))||'',scopes)||[]; var as=node.getAttribute('as');
        list.forEach(function(item){ var s={}; s[as]=item; build(Array.prototype.slice.call((node.content||node).childNodes),parent,scopes.concat([s]),root); });
        return;
      }
      if(tag==='template' && node.getAttribute('data-sc')==='if'){
        var cond=get(single(node.getAttribute('value'))||'',scopes);
        if(cond) build(Array.prototype.slice.call((node.content||node).childNodes),parent,scopes,root);
        return;
      }
      var el=node.namespaceURI==='http://www.w3.org/1999/xhtml'?document.createElement(tag):document.createElementNS(node.namespaceURI,tag);
      var pending=null;
      Array.prototype.forEach.call(node.attributes,function(a){
        var n=a.name;
        if(n.indexOf('hint-')===0) return;
        if(/^on/i.test(n)){ var p=single(a.value); var h=p?get(p,scopes):null; if(typeof h==='function') el.addEventListener(n.slice(2).toLowerCase(),h); return; }
        var val=interp(a.value,scopes);
        if(n==='value' && (tag==='input'||tag==='select')) pending=val;
        el.setAttribute(n,val);
      });
      build(Array.prototype.slice.call(node.childNodes),el,scopes,root);
      if(pending!==null) el.value=pending;
      parent.appendChild(el);
    });
  }
  var tpl=document.getElementById('tpl'); var app=document.getElementById('app'); var inst=new Component();
  window.__aigisRender=function(){
    var a=document.activeElement, id=a&&a.id, s0=null,s1=null;
    try{ if(a&&a.selectionStart!=null){ s0=a.selectionStart; s1=a.selectionEnd; } }catch(e){}
    var vals=inst.renderVals(); var frag=document.createDocumentFragment();
    build(Array.prototype.slice.call(tpl.content.childNodes),frag,[vals],app);
    app.replaceChildren(frag); Array.prototype.forEach.call(app.querySelectorAll('img[data-logo]'),function(i){ i.src=window.__LOGO; });
    if(id){ var n=document.getElementById(id); if(n){ n.focus(); try{ if(s0!=null) n.setSelectionRange(s0,s1); }catch(e){} } }
  };
  window.__aigisRender();
})();
</script>
