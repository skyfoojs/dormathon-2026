<svg xmlns="http://www.w3.org/2000/svg" width="190" height="226" viewBox="0 0 160 190" role="img" aria-label="Aegi, the AiGIS guardian" style="overflow:visible"><style>
.ai-sway{transform-origin:50% 100%;animation:aisway 4.4s ease-in-out infinite}
@keyframes aisway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
.ai-tailL,.ai-tailR{transform-box:fill-box;transform-origin:50% 0;animation:aitail 3.2s ease-in-out infinite}
.ai-tailR{animation-delay:-1.4s}
@keyframes aitail{0%,100%{transform:rotate(3deg)}50%{transform:rotate(-4deg)}}
.ai-ahoge{transform-box:fill-box;transform-origin:50% 100%;animation:aiahoge 2.6s ease-in-out infinite}
@keyframes aiahoge{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(8deg)}}
.ai-eye{transform-box:fill-box;transform-origin:50% 40%;animation:aiblink 4.6s infinite}
@keyframes aiblink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.ai-smile{opacity:1}
.ai-mo{opacity:0;transform-box:fill-box;transform-origin:50% 30%}
.ai-talk .ai-smile{opacity:0}
.ai-talk .ai-mo{opacity:1;animation:aitalk .26s ease-in-out infinite alternate}
@keyframes aitalk{from{transform:scaleY(.3)}to{transform:scaleY(1)}}
.ai-hand{transform-box:fill-box;transform-origin:50% 100%;animation:aiwave 1.2s ease-in-out infinite}
@keyframes aiwave{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(14deg)}}
.ai-sparkle{transform-box:fill-box;transform-origin:50% 50%;animation:aispark 2.2s ease-in-out infinite}
@keyframes aispark{0%,100%{transform:scale(.6);opacity:.4}50%{transform:scale(1.1);opacity:1}}
.ai-handwrap{transition:opacity .4s}
.ai-peek .ai-handwrap{opacity:0}
@media (prefers-reduced-motion:reduce){.ai-sway,.ai-tailL,.ai-tailR,.ai-ahoge,.ai-eye,.ai-hand,.ai-sparkle,.ai-dots i,.ai-bub,.ai-girl.ai-out{animation:none!important}}
.ai-mono{font-family:'IBM Plex Mono',ui-monospace,monospace;white-space:nowrap}
</style>
