<linearGradient id="aiIris" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1B6FC8"></stop><stop offset=".6" stop-color="#3DA5E0"></stop><stop offset="1" stop-color="#9BE1FF"></stop></linearGradient>
